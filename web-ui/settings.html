<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenBag — Settings</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body data-app-shell>
  <main>
    <h1>Settings</h1>
    <div id="result"></div>

    <h2>Preferences</h2>
    <form id="settings-form">
      <fieldset>
        <label for="settings-theme">Theme</label>
        <select id="settings-theme" name="theme">
          <option value="baggy">Baggy</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </fieldset>
      <fieldset>
        <label for="settings-items_per_page">Items per page</label>
        <input type="number" id="settings-items_per_page" name="items_per_page" min="5" max="200" value="30" />
      </fieldset>
      <fieldset>
        <label for="settings-reading_speed">Reading speed (words/min)</label>
        <input type="number" id="settings-reading_speed" name="reading_speed" min="50" max="1000" value="200" />
      </fieldset>
      <fieldset>
        <label for="settings-language">Language</label>
        <input type="text" id="settings-language" name="language" value="en" />
      </fieldset>
      <fieldset>
        <label><input type="checkbox" id="settings-action_mark_as_read" name="action_mark_as_read" />
          Mark as read when opened
        </label>
      </fieldset>
      <fieldset>
        <label><input type="checkbox" id="settings-list_mode" name="list_mode" />
          Compact list mode
        </label>
      </fieldset>
      <fieldset>
        <label><input type="checkbox" id="settings-display_thumbnails" name="display_thumbnails" checked />
          Show thumbnails
        </label>
      </fieldset>
      <button type="submit">Save preferences</button>
    </form>

    <h2>Feed token</h2>
    <p class="text-muted">
      Use a feed token to subscribe to your reading list in any RSS/Atom reader
      (no OAuth needed). The URLs are private while the token is valid.
    </p>
    <div id="feed-section"></div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
