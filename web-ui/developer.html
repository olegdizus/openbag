<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenBag — Developer</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>

<body data-app-shell>
  <main>
    <h1>Developer — OAuth clients</h1>
    <p class="text-muted">
      OAuth clients are how native Wallabag apps (and your own scripts) authenticate.
      The Wallabag token endpoint is <code>POST /oauth/v2/token</code> with grant type
      <code>password</code> or <code>refresh_token</code>.
    </p>
    <div id="result"></div>
    <fieldset>
      <label for="draft-name">New client name</label>
      <input type="text" id="draft-name" placeholder="e.g. Wallabag Android" />
      <button type="button" id="create-btn">Create client</button>
    </fieldset>
    <div id="clients"></div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/developer.js"></script>
</body>

</html>
