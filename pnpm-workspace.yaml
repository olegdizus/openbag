# pnpm workspace. OpenBag is three packages (ADR-0018):
#   @openbag/core    — shared TS (queries, session, crypto, sanitize, parser, auth primitives, types)
#   @openbag/api     — API Worker (/api/*, /oauth/*, /share/*)
#   @openbag/web-gui — UI Worker (HTML SSR + /ui/* mutations + static assets)
# Cross-package imports go through the @openbag/* aliases, never relative paths.
packages:
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
